name: Automaticky sazkovy analytik

on:
  schedule:
    # Spustí se každý den v 06:00 UTC (což je 08:00 našeho času)
    - cron: '0 6 * * *'
  workflow_dispatch: # Umožní ti spustit analýzu ručně tlačítkem v GitHub Actions

jobs:
  run-analyst:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Nezbytné, aby robot mohl uložit soubor data.json zpět do repozitáře

    steps:
    - name: Nacteni kodu z repozitare
      uses: actions/checkout@v4

    - name: Instalace Pythonu
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalace knihovny requests
      run: |
        pip install requests

    - name: Spusteni analyze
      env:
        # Tady si GitHub automaticky vezme tvůj tajný klíč
        ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }} 
      run: python bet.py

    - name: Ulozeni vysledku na web
      run: |
        git config --global user.name "GitHub Robot"
        git config --global user.email "actions@github.com"
        git add data.json
        # Commitne pouze pokud se soubor data.json změnil
        git diff-index --quiet HEAD || (git commit -m "Automaticka aktualizace sazky" && git push)